version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: test-platform-db
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: test-platform-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: test_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      ENGINE_DIR: /engine
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Override this in any shared/production environment:
      # ATTACHMENT_ENCRYPTION_KEY=$(openssl rand -base64 32)
      ATTACHMENT_ENCRYPTION_KEY: ${ATTACHMENT_ENCRYPTION_KEY:-dev-only-insecure-default-change-me}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: test-platform-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: test-platform-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Postgres connection details used by the auto-provisioned datasource below.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: test_platform
      PG_USER: postgres
      PG_PASSWORD: postgres
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"

volumes:
  pgdata:
  grafana-data:
